name: Android build

on:
  push:
    branches: ["**"]
    paths:
      - "graphro/**"
      - ".github/workflows/android.yml"
      - "!graphro/dist/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: graphro
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.GRAPHRO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "GRAPHRO_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi

      - name: Test engine and build app
        env:
          GRAPHRO_STORE_PASSWORD: ${{ secrets.GRAPHRO_STORE_PASSWORD }}
          GRAPHRO_KEY_ALIAS: ${{ secrets.GRAPHRO_KEY_ALIAS }}
          GRAPHRO_KEY_PASSWORD: ${{ secrets.GRAPHRO_KEY_PASSWORD }}
        run: |
          set +e
          ./gradlew --no-daemon :core:test :app:assembleDebug :app:bundleRelease :app:assembleRelease > build.log 2>&1
          code=$?
          tail -n 40 build.log
          if [ $code -ne 0 ]; then
            echo "===== ERROR SUMMARY ====="
            grep -E "^e: |error:|What went wrong|^> |Could not|Unresolved|FAILED|Exception" build.log | grep -v "^\s*at " | head -100
            exit $code
          fi

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphro-${{ github.sha }}
          path: |
            graphro/app/build/outputs/apk/**/*.apk
            graphro/app/build/outputs/bundle/**/*.aab
            graphro/app/build/outputs/mapping/release/mapping.txt
            graphro/core/build/reports/tests/
          if-no-files-found: ignore

      - name: Save outputs to the branch
        if: success() && github.event_name == 'push'
        run: |
          mkdir -p dist/ci
          cp app/build/outputs/apk/debug/app-debug.apk dist/ci/graphro-debug.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/ci/graphro-release-unsigned.aab
          cp app/build/outputs/apk/release/*.apk dist/ci/graphro-release-unsigned.apk 2>/dev/null || true
          echo "${GITHUB_SHA}" > dist/ci/SOURCE_COMMIT
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/ci
          git commit -m "CI 빌드 결과물 (${GITHUB_SHA::7}) [skip ci]" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        lang: [ko, en, ja]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: graphro-${{ github.sha }}
          path: out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: adb install -r out/app/build/outputs/apk/debug/app-debug.apk && bash graphro/tools/smoke.sh graphro/dist/ci/screens/${{ matrix.lang }} ${{ matrix.lang }}
      - name: Save screenshots to the branch
        if: always()
        run: |
          [ -d graphro/dist/ci/screens/${{ matrix.lang }} ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f graphro/dist/ci/screens/${{ matrix.lang }}
          git commit -m "에뮬레이터 실행 화면 ${{ matrix.lang }} (${GITHUB_SHA::7}) [skip ci]" || exit 0
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
